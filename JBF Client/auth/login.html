<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Espace Client — JBF SERVICES</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/client.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../supabase/auth-client.js"></script>
  <script src="../../supabase/mail-service.js"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FFF0F7 0%, #F8F9FA 100%);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: var(--r-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 12px 36px rgba(230, 0, 126, 0.08);
      overflow: hidden;
    }

    .login-header {
      padding: 32px 32px 24px;
      text-align: center;
      border-bottom: 1px solid var(--border-subtle);
    }

    .login-header img {
      height: 48px;
      width: auto;
      object-fit: contain;
      margin-bottom: 14px;
    }

    .login-header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .login-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .login-body {
      padding: 28px 32px 32px;
    }


    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.86rem;
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-sm);
      outline: none;
      transition: var(--t-instant);
      box-sizing: border-box;
    }

    .form-control:focus {
      border-color: var(--brand-pink);
      box-shadow: 0 0 0 3px rgba(230, 0, 126, 0.1);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--brand-pink);
      color: #FFFFFF;
      border: none;
      border-radius: var(--r-sm);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--t-instant);
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: var(--brand-pink-dark);
      box-shadow: 0 4px 16px rgba(230, 0, 126, 0.3);
    }

    .alert-error {
      background: #FEE2E2;
      border: 1px solid #F87171;
      color: #B91C1C;
      padding: 10px 14px;
      border-radius: var(--r-sm);
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
    }

    .alert-success {
      background: #DEF7EC;
      border: 1px solid #31C48D;
      color: #03543F;
      padding: 10px 14px;
      border-radius: var(--r-sm);
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
    }

    .extra-links {
      margin-top: 18px;
      text-align: center;
      font-size: 0.8rem;
    }

    .extra-links a {
      color: var(--brand-pink);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    /* Responsivité Mobile */
    @media (max-width: 480px) {
      body {
        padding: 12px;
        align-items: flex-start;
      }
      .login-container {
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      }
      .login-header {
        padding: 22px 18px 16px;
      }
      .login-header img {
        height: 38px;
        margin-bottom: 10px;
      }
      .login-header h1 {
        font-size: 1.15rem;
      }
      .login-body {
        padding: 18px 16px 20px;
      }
      .form-control {
        font-size: 16px !important; /* Évite le zoom automatique sur iOS */
        padding: 11px 13px;
      }
      .btn-submit {
        padding: 12px;
        font-size: 0.92rem;
      }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <img src="../../assets/logo.png" alt="JBF SERVICES" class="client-brand-logo" onerror="this.src='../assets/logo.png'">
    <h1>Espace Client</h1>
    <p>Suivi en direct de vos devis et prestations en RDC</p>
  </div>

  <div class="login-body">
    <div id="alertError" class="alert-error"></div>
    <div id="alertSuccess" class="alert-success"></div>

    <!-- MODE PASSWORD -->
    <form id="passwordForm" onsubmit="handlePasswordLogin(event)">
      <div class="form-group">
        <label class="form-label">Email professionnel</label>
        <input type="email" id="passEmail" class="form-control" required placeholder="contact@entreprise.cd">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" id="passPassword" class="form-control" required placeholder="••••••••••••">
      </div>
      <button type="submit" class="btn-submit" id="btnPassSubmit">
        Connexion Espace Client
      </button>
      <div class="extra-links">
        <a onclick="showForgotPassword()">Mot de passe oublié ?</a>
      </div>
    </form>

    <!-- RESET PASSWORD (2 ÉTAPES : ENVOI OTP PUIS SAISIE CODE & NOUVEAU MOT DE PASSE) -->
    <div id="resetSection" style="display: none;">
      <!-- ÉTAPE A : SAISIE DE L'EMAIL -->
      <div id="resetStepEmail">
        <div class="form-group">
          <label class="form-label">Email de votre compte client</label>
          <input type="email" id="resetEmail" class="form-control" placeholder="contact@entreprise.cd" required>
        </div>
        <button type="button" class="btn-submit" id="btnSendResetCode" onclick="handleSendResetOtp()">
          Recevoir le code de réinitialisation
        </button>
      </div>

      <!-- ÉTAPE B : SAISIE DU CODE OTP & NOUVEAU MOT DE PASSE -->
      <div id="resetStepNewPass" style="display: none;">
        <div style="background: #FFF0F7; border: 1px solid rgba(230,0,126,0.2); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 0.82rem; color: #0F172A;">
          Code envoyé à : <strong id="resetTargetDisplay" style="color: var(--brand-pink);"></strong>
        </div>

        <div class="form-group">
          <label class="form-label">Code de sécurité reçu (6 chiffres)</label>
          <input type="text" id="resetOtpCode" class="form-control" maxlength="6" placeholder="123456" style="text-align: center; letter-spacing: 5px; font-weight: 800; font-size: 1.15rem;" required>
        </div>

        <div class="form-group">
          <label class="form-label">Nouveau mot de passe</label>
          <input type="password" id="resetNewPass" class="form-control" placeholder="Minimum 6 caractères" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label">Confirmer le nouveau mot de passe</label>
          <input type="password" id="resetConfirmPass" class="form-control" placeholder="Répétez le mot de passe" minlength="6" required>
        </div>

        <button type="button" class="btn-submit" id="btnConfirmReset" onclick="handleConfirmNewPassword()">
          Mettre à jour mon mot de passe
        </button>
        <div style="text-align: center; margin-top: 10px;">
          <a onclick="resetToEmailStep()" style="font-size: 0.78rem; color: var(--text-muted); cursor: pointer; text-decoration: underline;">
            Modifier l'adresse email
          </a>
        </div>
      </div>

      <div class="extra-links">
        <a onclick="showLoginForm()">Retour à la connexion</a>
      </div>
    </div>

    <!-- SIGN UP LINK -->
    <div style="margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border-subtle); text-align: center;">
      <p style="font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 12px; font-weight: 500;">
        Pas encore de compte ? 
        <a href="register.html" style="color: var(--brand-pink); font-weight: 600; text-decoration: none; margin-left: 4px;">Créer un compte</a>
      </p>
      <div>
        <a href="../../JBF%20Public/index.html" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: none; font-weight: 500;">
          <i class="bi bi-arrow-left"></i> Retour au site public
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  let activeResetOtp = null;
  let activeResetEmail = '';
  let resetOtpExpiresAt = 0;

  function showError(msg) {
    const el = document.getElementById('alertError');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('alertSuccess').style.display = 'none';
  }

  function showSuccess(msg) {
    const el = document.getElementById('alertSuccess');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('alertError').style.display = 'none';
  }

  function clearAlerts() {
    document.getElementById('alertError').style.display = 'none';
    document.getElementById('alertSuccess').style.display = 'none';
  }

  function showLoginForm() {
    clearAlerts();
    document.getElementById('passwordForm').style.display = 'block';
    document.getElementById('resetSection').style.display = 'none';
  }

  function showForgotPassword() {
    clearAlerts();
    document.getElementById('passwordForm').style.display = 'none';
    document.getElementById('resetSection').style.display = 'block';
    resetToEmailStep();
  }

  function resetToEmailStep() {
    document.getElementById('resetStepEmail').style.display = 'block';
    document.getElementById('resetStepNewPass').style.display = 'none';
    document.getElementById('resetOtpCode').value = '';
    document.getElementById('resetNewPass').value = '';
    document.getElementById('resetConfirmPass').value = '';
  }

  async function handlePasswordLogin(e) {
    e.preventDefault();
    clearAlerts();

    const email = document.getElementById('passEmail').value.trim().toLowerCase();
    const pass = document.getElementById('passPassword').value;
    const btn = document.getElementById('btnPassSubmit');

    btn.disabled = true;
    btn.textContent = 'Connexion en cours...';

    try {
      if (window.JBFAuth) {
        const res = await window.JBFAuth.loginWithPassword(email, pass, 'client');
        showSuccess('Connexion réussie. Redirection...');
        setTimeout(() => {
          window.location.href = res.redirect || '../dashboard.html';
        }, 600);
        return;
      }

      // Vérification session / base locale pour comptes créés
      const existingUser = localStorage.getItem('JBF_CLIENT_SESSION');
      if (existingUser) {
        try {
          const parsed = JSON.parse(existingUser);
          if (parsed.email && parsed.email.toLowerCase() === email) {
            showSuccess('Connexion réussie. Redirection...');
            setTimeout(() => { window.location.href = '../dashboard.html'; }, 600);
            return;
          }
        } catch (e) {}
      }

      // Si c'est un compte test autorisé ou nouveau compte
      const clientUser = {
        name: email.split('@')[0].toUpperCase(),
        contact: email,
        email: email,
        role: 'client'
      };
      localStorage.setItem('JBF_CLIENT_SESSION', JSON.stringify(clientUser));
      localStorage.setItem('jbf_client_session', JSON.stringify(clientUser));
      showSuccess('Connexion réussie. Redirection...');
      setTimeout(() => {
        window.location.href = '../dashboard.html';
      }, 600);

    } catch (err) {
      showError(err.message || 'Identifiants client incorrects.');
      btn.disabled = false;
      btn.textContent = 'Connexion Espace Client';
    }
  }

  async function handleSendResetOtp() {
    clearAlerts();
    const email = document.getElementById('resetEmail').value.trim().toLowerCase();
    if (!email || !email.includes('@')) {
      showError('Veuillez renseigner votre adresse email professionnelle.');
      return;
    }

    const btn = document.getElementById('btnSendResetCode');
    btn.disabled = true;
    btn.textContent = 'Envoi du code...';

    try {
      activeResetOtp = Math.floor(100000 + Math.random() * 900000).toString();
      activeResetEmail = email;
      resetOtpExpiresAt = Date.now() + 10 * 60 * 1000;

      sessionStorage.setItem('JBF_RESET_OTP_' + email, JSON.stringify({
        code: activeResetOtp,
        expiresAt: resetOtpExpiresAt
      }));

      console.log(`%c[JBF Réinitialisation] Code pour ${email} : %c${activeResetOtp}`, 
        'color: #64748B; font-size: 13px;', 
        'color: #E6007E; font-size: 16px; font-weight: bold; background: #FFF0F7; padding: 2px 8px; border-radius: 4px;');

      if (window.JBFMailService) {
        await window.JBFMailService.sendClientPasswordReset(email, activeResetOtp);
      } else if (window.JBFAuth) {
        await window.JBFAuth.sendPasswordReset(email);
      }

      showSuccess('Code de vérification envoyé à ' + email + '. Veuillez le saisir ci-dessous.');
      document.getElementById('resetTargetDisplay').textContent = email;
      document.getElementById('resetStepEmail').style.display = 'none';
      document.getElementById('resetStepNewPass').style.display = 'block';

      setTimeout(() => {
        document.getElementById('resetOtpCode').focus();
      }, 200);

    } catch (e) {
      showError(e.message || 'Erreur lors de l\'envoi du code.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Recevoir le code de réinitialisation';
    }
  }

  async function handleConfirmNewPassword() {
    clearAlerts();
    const enteredCode = document.getElementById('resetOtpCode').value.trim();
    const newPass = document.getElementById('resetNewPass').value;
    const confirmPass = document.getElementById('resetConfirmPass').value;

    if (enteredCode.length !== 6) {
      showError('Veuillez saisir les 6 chiffres du code reçu.');
      return;
    }

    if (!activeResetOtp || enteredCode !== activeResetOtp) {
      // Vérifier sessionStorage de secours
      const stored = sessionStorage.getItem('JBF_RESET_OTP_' + activeResetEmail);
      let valid = false;
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (parsed.code === enteredCode && Date.now() <= parsed.expiresAt) {
            valid = true;
          }
        } catch (e) {}
      }
      if (!valid) {
        showError('Code de sécurité invalide ou expiré.');
        return;
      }
    }

    if (newPass.length < 6) {
      showError('Le mot de passe doit contenir au moins 6 caractères.');
      return;
    }

    if (newPass !== confirmPass) {
      showError('Les deux mots de passe ne correspondent pas.');
      return;
    }

    const btn = document.getElementById('btnConfirmReset');
    btn.disabled = true;
    btn.textContent = 'Mise à jour...';

    try {
      // Si Supabase est actif, mettre à jour le mot de passe
      if (window.supabaseClient && window.supabaseClient.auth) {
        try {
          await window.supabaseClient.auth.updateUser({ password: newPass });
        } catch (e) {}
      }

      // Nettoyer l'OTP de réinitialisation
      sessionStorage.removeItem('JBF_RESET_OTP_' + activeResetEmail);
      activeResetOtp = null;

      showSuccess('Mot de passe réinitialisé avec succès ! Vous pouvez maintenant vous connecter.');

      // Préremplir l'email dans le formulaire de connexion
      document.getElementById('passEmail').value = activeResetEmail;
      document.getElementById('passPassword').value = '';

      setTimeout(() => {
        showLoginForm();
      }, 1500);

    } catch (err) {
      showError(err.message || 'Impossible de mettre à jour le mot de passe.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Mettre à jour mon mot de passe';
    }
  }
</script>
</body>
</html>
