name: Flutter — build apps JBF

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-build.yml'
  pull_request:
    paths:
      - 'flutter/**'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.4'
  JAVA_VERSION: '17'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Pub get (shell + apps)
        run: |
          cd flutter/packages/jbf_portal_shell && flutter pub get
          for app in jbf_admin jbf_membre jbf_client; do
            cd "$GITHUB_WORKSPACE/flutter/$app"
            flutter pub get
          done
      - name: Analyze
        run: |
          cd flutter/packages/jbf_portal_shell && flutter analyze
          for app in jbf_admin jbf_membre jbf_client; do
            cd "$GITHUB_WORKSPACE/flutter/$app"
            flutter analyze
          done
      - name: Unit tests
        run: |
          cd flutter/packages/jbf_portal_shell && flutter test
          for app in jbf_admin jbf_membre jbf_client; do
            cd "$GITHUB_WORKSPACE/flutter/$app" && flutter test
          done

  build-android:
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [jbf_admin, jbf_membre, jbf_client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build APK
        working-directory: flutter/${{ matrix.app }}
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}-apk
          path: flutter/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows-admin-membre:
    needs: analyze
    runs-on: windows-latest
    strategy:
      matrix:
        app: [jbf_admin, jbf_membre]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Build Windows
        working-directory: flutter/${{ matrix.app }}
        run: |
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.app }}
          path: flutter/${{ matrix.app }}/build/windows/x64/runner/Release/
          if-no-files-found: error

  build-macos-admin-membre:
    needs: analyze
    runs-on: macos-latest
    strategy:
      matrix:
        app: [jbf_admin, jbf_membre]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Build macOS
        working-directory: flutter/${{ matrix.app }}
        run: |
          flutter pub get
          flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.app }}
          path: flutter/${{ matrix.app }}/build/macos/Build/Products/Release/
          if-no-files-found: error

  build-ios:
    needs: analyze
    runs-on: macos-latest
    strategy:
      matrix:
        app: [jbf_admin, jbf_membre, jbf_client]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build iOS (no codesign)
        working-directory: flutter/${{ matrix.app }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.app }}-unsigned
          path: flutter/${{ matrix.app }}/build/ios/iphoneos/
          if-no-files-found: warn
