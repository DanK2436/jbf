name: Lot visuel — palette et chargement

on:
  push:
    branches: ['cursor/jbf-palette-portail-6f12']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrôle palette, loader et diaporama
        run: |
          node --check "JBF Public/js/hero-slideshow.js"
          python3 - <<'PY'
          from pathlib import Path
          css = Path("JBF Public/css/main.css").read_text(encoding="utf-8")
          client = Path("JBF Client/css/client.css").read_text(encoding="utf-8")
          home = Path("JBF Public/index.html").read_text(encoding="utf-8")
          contact = Path("JBF Public/contact.html").read_text(encoding="utf-8")
          js = Path("JBF Public/js/hero-slideshow.js").read_text(encoding="utf-8")
          required = {
              "gris toile": "#F6F6F7" in css,
              "rose pale": "#FADCEA" in css,
              "rose logo": "#DE026A" in css,
              "noir": "#0C0C0E" in css or "#141416" in css,
              "mouvement css": "prefers-reduced-motion: reduce" in css and "prefers-reduced-motion: reduce" in client,
              "erreur contact": "field-error" in css or "field-error" in contact,
              "diaporama manuel": "setInterval" not in js and "strictement manuel" in js,
          }
          missing = [name for name, ok in required.items() if not ok]
          if missing:
              raise SystemExit("marqueurs absents : " + ", ".join(missing))
          print("OK palette, loader et diaporama")
          PY
