<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Espace Membre & Équipes — JBF SERVICES</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../supabase/auth-client.js"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FFF0F7 0%, #F8F4F6 100%);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: var(--r-card);
      border: 1px solid var(--gray-border);
      box-shadow: 0 12px 36px rgba(230, 0, 126, 0.08);
      overflow: hidden;
    }

    .login-header {
      padding: 32px 32px 24px;
      text-align: center;
      border-bottom: 1px solid var(--gray-border);
    }

    .login-header img {
      height: 48px;
      width: auto;
      object-fit: contain;
      margin-bottom: 14px;
    }

    .login-header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-h);
      letter-spacing: -0.3px;
    }

    .login-header p {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 4px;
    }

    .login-body {
      padding: 28px 32px 32px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-body);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.86rem;
      border: 1px solid var(--gray-border);
      border-radius: 8px;
      outline: none;
      transition: var(--t-fast);
      box-sizing: border-box;
    }

    .form-control:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(230, 0, 126, 0.1);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--pink);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--t-fast);
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: var(--pink-hover);
      box-shadow: 0 4px 16px rgba(230, 0, 126, 0.3);
    }

    .alert-error {
      background: #FEE2E2;
      border: 1px solid #F87171;
      color: #B91C1C;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
    }

    .alert-success {
      background: #DEF7EC;
      border: 1px solid #31C48D;
      color: #03543F;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
    }

    .extra-links {
      margin-top: 18px;
      text-align: center;
      font-size: 0.8rem;
    }

    .extra-links a {
      color: var(--pink);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <img src="../../assets/logo.png" alt="JBF SERVICES" class="admin-brand-logo" onerror="this.src='../assets/logo.png'">
    <h1>Espace Collaborateur</h1>
    <p>Portail Opérationnel & Chefs d'Équipe JBF</p>
  </div>

  <div class="login-body">
    <div id="alertError" class="alert-error"></div>
    <div id="alertSuccess" class="alert-success"></div>

    <!-- MODE: PASSWORD ONLY -->
    <form id="passwordForm" onsubmit="handlePasswordLogin(event)">
      <div class="form-group">
        <label class="form-label">Email professionnel (ou autorisé JBF)</label>
        <input type="email" id="passEmail" class="form-control" required placeholder="collaborateur@jbf-services.cd ou votre email" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" id="passPassword" class="form-control" required placeholder="••••••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit" id="btnPassSubmit">
        Connexion Espace Membre
      </button>
      <div class="extra-links">
        <span style="font-size:0.8rem; color: var(--text-light);">
          Mot de passe oublié ? Rendez-vous au bureau de l'administration pour le réinitialiser.
        </span>
      </div>
    </form>


  </div>
</div>

<script>
  function showError(msg) {
    const el = document.getElementById('alertError');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('alertSuccess').style.display = 'none';
  }

  function showSuccess(msg) {
    const el = document.getElementById('alertSuccess');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('alertError').style.display = 'none';
  }

  function clearAlerts() {
    document.getElementById('alertError').style.display = 'none';
    document.getElementById('alertSuccess').style.display = 'none';
  }

  async function handlePasswordLogin(e) {
    e.preventDefault();
    clearAlerts();

    const email = document.getElementById('passEmail').value.trim().toLowerCase();
    const pass = document.getElementById('passPassword').value;
    const btn = document.getElementById('btnPassSubmit');

    if (!email || !email.includes('@')) {
      showError('Veuillez saisir une adresse email valide.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Connexion...';

    try {
      let authUser = null;
      let session = null;

      if (window.JBFAuth) {
        const res = await window.JBFAuth.loginWithPassword(email, pass, 'membre');
        if (res && res.user) {
          authUser = res.user;
          session = res.session;
        }
      } else if (window.supabase) {
        const client = window.supabase.createClient(
          'https://dvzwqxcaiagczyonrhsg.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2endxeGNhaWFnY3p5b25yaHNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODEzNzIsImV4cCI6MjEwNTE1NzM3Mn0.uam5Z-d6SWS9-4Ly9f0ircJPryFJwOXbNp9_alHHl-o'
        );
        const { data, error } = await client.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
        authUser = data.user;
        session = data.session;
      }

      if (!authUser) {
        throw new Error('Identifiants collaborateur incorrects.');
      }

      // Vérifier le rôle dans les profils
      let role = 'Membre';
      let nom = authUser.user_metadata?.full_name || email.split('@')[0];
      try {
        const client = window.JBFAuth?.client || (window.supabase ? window.supabase.createClient('https://dvzwqxcaiagczyonrhsg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2endxeGNhaWFnY3p5b25yaHNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODEzNzIsImV4cCI6MjEwNTE1NzM3Mn0.uam5Z-d6SWS9-4Ly9f0ircJPryFJwOXbNp9_alHHl-o') : null);
        if (client) {
          const { data: prof } = await client.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
          if (prof) {
            nom = prof.nom_complet || prof.full_name || nom;
            role = prof.role || role;
          }
        }
      } catch (_) {}

      const memberUser = {
        id: authUser.id,
        nom: nom,
        email: email,
        role: role,
        statut_equipe: 'Actif',
        token: session?.access_token || ('jbf-session-' + Date.now())
      };
      localStorage.setItem('JBF_MEMBER_SESSION', JSON.stringify(memberUser));
      localStorage.setItem('jbf_member_session', JSON.stringify(memberUser));

      showSuccess('Connexion réussie. Redirection vers le tableau de bord...');
      setTimeout(() => {
        window.location.href = '../dashboard.html';
      }, 500);

    } catch (err) {
      showError(err.message || 'Identifiants collaborateur incorrects. Contactez l\'administration.');
      btn.disabled = false;
      btn.textContent = 'Connexion Espace Membre';
    }
  }
</script>
</body>
</html>
