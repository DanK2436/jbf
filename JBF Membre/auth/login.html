<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Espace Membre & Équipes — JBF SERVICES</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../../supabase/member-portal-rpc.js"></script>
  <script src="../js/member-login.js"></script>
  <script src="../js/member-supabase-auth.js"></script>
  <script src="../../supabase/auth-client.js"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FFF0F7 0%, #F8F4F6 100%);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: var(--r-card);
      border: 1px solid var(--gray-border);
      box-shadow: 0 12px 36px rgba(230, 0, 126, 0.08);
      overflow: hidden;
    }

    .login-header {
      padding: 32px 32px 24px;
      text-align: center;
      border-bottom: 1px solid var(--gray-border);
    }

    .login-header img {
      height: 48px;
      width: auto;
      object-fit: contain;
      margin-bottom: 14px;
    }

    .login-header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-h);
      letter-spacing: -0.3px;
    }

    .login-header p {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 4px;
    }

    .login-body {
      padding: 28px 32px 32px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-body);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.86rem;
      border: 1px solid var(--gray-border);
      border-radius: 8px;
      outline: none;
      transition: var(--t-fast);
      box-sizing: border-box;
    }

    .form-control:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(230, 0, 126, 0.1);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--pink);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--t-fast);
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: var(--pink-hover);
      box-shadow: 0 4px 16px rgba(230, 0, 126, 0.3);
    }

    .alert-error {
      background: #FEE2E2;
      border: 1px solid #F87171;
      color: #B91C1C;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
    }

    .alert-success {
      background: #DEF7EC;
      border: 1px solid #31C48D;
      color: #03543F;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
    }

    .extra-links {
      margin-top: 18px;
      text-align: center;
      font-size: 0.8rem;
    }

    .extra-links a {
      color: var(--pink);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <img src="../../assets/logo.png" alt="JBF SERVICES" class="admin-brand-logo" onerror="this.src='../assets/logo.png'">
    <h1>Espace Collaborateur</h1>
    <p>Portail Opérationnel & Chefs d'Équipe JBF</p>
  </div>

  <div class="login-body">
    <div id="alertError" class="alert-error"></div>
    <div id="alertSuccess" class="alert-success"></div>

    <!-- MODE: PASSWORD ONLY -->
    <form id="passwordForm" onsubmit="handlePasswordLogin(event)">
      <div class="form-group">
        <label class="form-label">Email professionnel (ou autorisé JBF)</label>
        <input type="email" id="passEmail" class="form-control" required placeholder="collaborateur@jbf-services.cd ou votre email" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" id="passPassword" class="form-control" required placeholder="••••••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit" id="btnPassSubmit">
        Connexion Espace Membre
      </button>
      <div class="extra-links">
        <span style="font-size:0.8rem; color: var(--text-light);">
          Mot de passe oublié ? Rendez-vous au bureau de l'administration pour le réinitialiser.
        </span>
      </div>
    </form>


  </div>
</div>

<script>
  function showError(msg) {
    const el = document.getElementById('alertError');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('alertSuccess').style.display = 'none';
  }

  function showSuccess(msg) {
    const el = document.getElementById('alertSuccess');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('alertError').style.display = 'none';
  }

  function clearAlerts() {
    document.getElementById('alertError').style.display = 'none';
    document.getElementById('alertSuccess').style.display = 'none';
  }

  async function handlePasswordLogin(e) {
    e.preventDefault();
    clearAlerts();

    const email = document.getElementById('passEmail').value.trim().toLowerCase();
    const pass = document.getElementById('passPassword').value;
    const btn = document.getElementById('btnPassSubmit');

    if (!email || !email.includes('@')) {
      showError('Veuillez saisir une adresse email valide.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Connexion...';

    function finishLocalLogin(localUser) {
      localStorage.setItem('JBF_MEMBER_SESSION', JSON.stringify(localUser));
      localStorage.setItem('jbf_member_session', JSON.stringify(localUser));
      showSuccess('Connexion réussie. Redirection...');
      setTimeout(() => { window.location.href = '../dashboard.html'; }, 500);
    }

    const passTrim = pass.trim();

    try {
      if (window.JBFMemberSupabaseAuth?.tryRpcMemberLogin) {
        const rpcUser = await window.JBFMemberSupabaseAuth.tryRpcMemberLogin(email, passTrim);
        if (rpcUser) {
          finishLocalLogin(rpcUser);
          return;
        }
      }

      if (window.JBFMemberLogin?.tryLocalMemberLogin) {
        const localUser = window.JBFMemberLogin.tryLocalMemberLogin(email, passTrim);
        if (localUser) {
          finishLocalLogin(localUser);
          return;
        }
      }

      if (window.JBFAuth?.loginWithPassword) {
        try {
          const res = await window.JBFAuth.loginWithPassword(email, passTrim, 'membre');
          if (res && (res.success || res.user)) {
            showSuccess('Connexion réussie. Redirection...');
            setTimeout(() => {
              window.location.href = res.redirect || '../dashboard.html';
            }, 500);
            return;
          }
        } catch (authErr) {
          console.warn('[Membre Auth Supabase]', authErr.message);
        }
      }

      const rpcErr = window.JBFMemberSupabaseAuth?.getLastLoginError?.();
      if (rpcErr === 'rpc_missing') {
        showError('Connexion portail non configurée côté serveur. L\'admin doit exécuter supabase/migrations/20261019_member_portal_login.sql dans Supabase, puis resynchroniser le collaborateur (fiche → mot de passe portail).');
      } else if (rpcErr === 'no_client') {
        showError('Configuration Supabase introuvable sur cette page. Rechargez avec Ctrl+Shift+R ou contactez l\'administration.');
      } else if (rpcErr === 'network' || rpcErr === 'rpc_error') {
        showError('Impossible de joindre Supabase. Vérifiez le réseau ou réessayez. Si le problème persiste, l\'admin doit resynchroniser votre compte depuis Collaborateurs.');
      } else if (rpcErr === 'invalid_credentials') {
        showError('Aucun compte portail actif pour cet email/mot de passe. L\'admin doit ouvrir Collaborateurs → votre fiche → « Resynchroniser connexion membre », saisir exactement le même mot de passe, et attendre le message « Connexion testée avec succès ».');
      } else {
        showError('Connexion refusée. Vérifiez email et mot de passe (min. 6 caractères). L\'admin doit resynchroniser le compte depuis la fiche collaborateur.');
      }
    } catch (err) {
      showError(err.message || 'Erreur de connexion. Contactez l\'administration JBF.');
    }

    btn.disabled = false;
    btn.textContent = 'Connexion Espace Membre';
  }
</script>
</body>
</html>
